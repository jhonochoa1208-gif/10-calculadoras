<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgeFlow Pro · Calculadora de Edad</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Fondo con ondas (opcional, puedes activarlo o desactivarlo) -->
    <div class="background-waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="container">
        <div class="calculator-card">
            <div class="header">
                <h1>
                    <span>AgeFlow Pro</span>
                </h1>
                <p class="subtitle">Precisión y elegancia en el cálculo de tu edad</p>
            </div>

            <div class="input-section">
                <div class="date-picker">
                    <label for="birthdate">
                        <span class="label-icon">📅</span>
                        Fecha de nacimiento
                    </label>
                    <input type="date" id="birthdate" class="date-input" max="">
                </div>

                <button id="calculateBtn" class="calculate-btn">
                    <span class="btn-text">Calcular edad</span>
                    <span class="btn-icon">→</span>
                </button>
            </div>

            <div class="result-section" id="resultSection">
                <div class="age-display">
                    <div class="age-item">
                        <span class="age-number" id="years">--</span>
                        <span class="age-label">Años</span>
                    </div>
                    <span class="age-separator">•</span>
                    <div class="age-item">
                        <span class="age-number" id="months">--</span>
                        <span class="age-label">Meses</span>
                    </div>
                    <span class="age-separator">•</span>
                    <div class="age-item">
                        <span class="age-number" id="days">--</span>
                        <span class="age-label">Días</span>
                    </div>
                </div>

                <div class="extra-info" id="extraInfo">
                    <div class="info-card">
                        <span class="info-label">Próximo cumpleaños</span>
                        <span class="info-value" id="nextBirthday">--</span>
                    </div>
                    <div class="info-card">
                        <span class="info-label">Días restantes</span>
                        <span class="info-value" id="daysUntilBirthday">--</span>
                    </div>
                    <div class="info-card">
                        <span class="info-label">Días vividos</span>
                        <span class="info-value" id="totalDays">--</span>
                    </div>
                </div>
            </div>

            <div class="footer">
                <p>© 2024 AgeFlow Pro · Diseño de alta gama</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
