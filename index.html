<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Calculadoras Profesionales</title>
    <!-- Font Awesome (necesario para los iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Tu archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wave-bg"></div>
    
    <!-- Partículas flotantes -->
    <div class="particle" style="top: 10%; left: 5%; font-size: 2rem;">✨</div>
    <div class="particle" style="top: 20%; right: 10%; font-size: 2.5rem; animation-delay: -2s;">🌟</div>
    <div class="particle" style="bottom: 15%; left: 15%; font-size: 2rem; animation-delay: -4s;">💫</div>
    <div class="particle" style="bottom: 25%; right: 20%; font-size: 3rem; animation-delay: -1s;">⭐</div>

    <h1>
        <i class="fas fa-calculator"></i>
        10 Calculadoras Profesionales
        <i class="fas fa-magic"></i>
    </h1>
    
    <div class="grid-container">
        <!-- AQUÍ VA TODO EL HTML DE LAS 10 CALCULADORAS -->
        <!-- (Copia todo el contenido del grid-container del código anterior) -->
    </div>

    <script>
        // AQUÍ VAN TODAS LAS FUNCIONES JAVASCRIPT
        // (Copia todas las funciones del código anterior)
        
        // Efecto de seguimiento del mouse
        document.querySelectorAll('.calculadora').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                card.style.setProperty('--x', `${x}%`);
                card.style.setProperty('--y', `${y}%`);
            });
        });

        window.onload = function() {
            calcularBasica();
            calcularIMC();
            calcularPorcentaje();
            calcularPrestamo();
            calcularEdad();
            calcularDescuento();
            convertirTemperatura();
            calcularAreaCirculo();
            calcularPropina();
            calcularVelocidad();
        };
    </script>
</body>
</html>
