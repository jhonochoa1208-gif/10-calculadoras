<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Edad</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
    width:300px;
}

h1{
    margin-bottom:20px;
}

input{
    padding:10px;
    width:100%;
    margin-bottom:15px;
    font-size:16px;
}

button{
    padding:10px;
    width:100%;
    background:#4facfe;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#2f80ed;
}

.result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>Calculadora de Edad</h1>

<input type="date" id="birthdate">

<button onclick="calcularEdad()">Calcular Edad</button>

<div class="result" id="resultado"></div>
</div>

<script>
function calcularEdad(){

let birthdate = new Date(document.getElementById("birthdate").value);
let hoy = new Date();

if(!birthdate.getTime()){
document.getElementById("resultado").innerText="Selecciona una fecha válida";
return;
}

let edad = hoy.getFullYear() - birthdate.getFullYear();
let mes = hoy.getMonth() - birthdate.getMonth();

if(mes < 0 || (mes === 0 && hoy.getDate() < birthdate.getDate())){
edad--;
}

document.getElementById("resultado").innerText = "Tienes " + edad + " años";
}
</script>

</body>
</html>
